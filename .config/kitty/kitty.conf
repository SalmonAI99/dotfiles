font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto


font_size 11.0
cursor_shape block

scrollback_lines 100


background_opacity 0.8

background_blur 100


mouse_hide_wait 3.0


shell /bin/zsh --login


map kitty_mod+page_up scroll_page_up

include ~/.config/kitty/themes/Tokyo Night Storm.conf

